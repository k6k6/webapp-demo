<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>file</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background: #f5f7fa;
            padding: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .form-section {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .form-section h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #333;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: inline-block;
            width: 80px;
            text-align: right;
            margin-right: 10px;
            color: #666;
        }
        .form-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: calc(100% - 100px);
        }
        button {
            padding: 8px 16px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 5px;
        }
        button:hover {
            background: #66b1ff;
        }
        .file-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        .file-table th,
        .file-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .file-table th {
            background: #f8f9fa;
            font-weight: normal;
            color: #666;
        }
        .form-group input:focus {
            border-color: #409eff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(64,158,255,0.1);
        }
        @media (max-width: 576px) {
            .form-group label {
                width: 100%;
                text-align: left;
                margin-bottom: 6px;
            }
            .form-group input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="form-section">
        <h2>文件上传</h2>
        <form action="upload" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label>文件：</label>
                <input type="file" name="myfile" />
            </div>
            <div class="form-group">
                <label>可选名：</label>
                <input type="text" name="filename" />
            </div>
            <button type="submit">上传</button>
        </form>
    </div>

    <div class="form-section">
        <h2>文件列表</h2>
        <form action="show">
            <table class="file-table">
                <thead>
                <tr>
                    <th>名称</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${allfiles}">
                    <td th:text="${f.getName()}">文件名</td>
                    <td>
                        <form action="download" method="post" style="display: inline;">
                            <input type="hidden" name="fileName" th:value="${f.getName()}">
                            <button type="submit">下载</button>
                        </form>
                        <form action="delete" method="post" style="display: inline;">
                            <input type="hidden" name="fileName" th:value="${f.getName()}">
                            <button type="submit">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </form>
    </div>
</div>
</body>
</html>
